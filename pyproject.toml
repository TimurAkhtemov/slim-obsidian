[project]
name = "slim"
version = "0.1.0"
description = "Sparse Local Intelligence & Memory — local-first personal intelligence agent"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Timur Akhtemov" }]
keywords = ["obsidian", "transcription", "local-first", "ollama", "notes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "numpy>=2.1,<2.5",  # numba (via mlx-whisper) caps numpy<2.5; slim uses only stable API
    "parakeet-mlx>=0.3",
    "pillow>=10",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
slim = "slim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slim"]
