# SLIM subject registry — copy to `config/projects.yaml` (gitignored) and make it yours.
#
# Subject is the only folder axis: an id IS the folder name under `Notes/<id>` (derived in
# `config.project_prefix`), so ids are single lowercase path segments, and the copilot's Nearby
# notes widen to it. Filing does not read this file: the card
# proposes folders that exist. `description` tells the titling model (`enrich`) what a subject is.

# The name the prompts address you by. Only interpretation reads it — labels, summaries,
# the nightly reflection; no path, id or filter ever does.
owner: "Alex"

projects:
  work:
    description: "Day job — meetings, one-on-ones, project notes."

  school:
    description: "Coursework — lectures, readings, assignments."

  side-project:
    description: "The thing being built on evenings and weekends."

# Personal data masked in recording transcripts, at capture and by `slim mask`, each value
# replaced by a placeholder such as `[SSN]`. Classes: ssn, card, account, password, email,
# address, phone; at capture, ssn, card, account and password are also silenced in the
# archived audio (`slim mask` changes text only).
# The default is all but phone: add `phone` to mask phone numbers; `[]` turns masking off.
# `skip` lists vault folders `slim mask --all` leaves alone (whole path segments; a note
# named on the command line is still masked). A name that is not a class is an error at start.
# The list is read when the server starts: restart it after a change, and after adding a class
# run `slim mask --all --force` for recordings already filed.
# pii:
#   mask: [ssn, card, account, password, email, address]
#   skip: [Notes/some-folder]
